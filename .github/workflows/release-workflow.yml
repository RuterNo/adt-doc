name: Release workflow

on:
  push:
    tags:
      - 4.**

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install bundle script dependencies
        run: pnpm install

      - name: Bundle AsyncAPI document
        run: node scripts/bundle-asyncapi.js

      - name: Install AsyncAPI CLI
        run: pnpm add -g @asyncapi/cli

      - name: Generate HTML from AsyncAPI document
        run: asyncapi generate fromTemplate asyncapi/asyncapi.yml @asyncapi/html-template -o docs/asyncapi --force-write --param config='{"sidebar":{"useChannelAddressAsIdentifier":true}}'

      - run: npx @redocly/cli build-docs -o docs/openapi/trafficplan/index.html openapi/trafficplan/api-spec.json
      - run: npx @redocly/cli build-docs -o docs/openapi/operational/index.html openapi/operational/api-spec.json

      - name: Modify HTML output from generator
        run: |
          sudo sed -i 's/version\.from\.tag/${{github.ref_name}}/g' docs/asyncapi/index.html
          sudo sed -i 's/version\.from\.tag/${{github.ref_name}}/g' docs/openapi/trafficplan/index.html
          sudo sed -i 's/version\.from\.tag/${{github.ref_name}}/g' docs/openapi/operational/index.html
          sudo cp asyncapi/stylesheets/doc.css docs/asyncapi/css/
          sudo mkdir docs/asyncapi/images/
          sudo cp asyncapi/markdown/images/* docs/asyncapi/images/
          sudo sed -i -e '\@</head>@i\<link href="css/doc.css" rel="stylesheet">' docs/asyncapi/index.html
        shell: bash

      - name: Make Json Schemas available
        run: |
          sudo cp -r asyncapi/json-schemas docs/asyncapi/json-schemas
          sudo find docs/asyncapi/json-schemas/ -name "*example.json" -type f -delete
          sudo find docs/asyncapi/json-schemas/ -name "*.meta.json" -type f -delete
          sudo find docs/asyncapi/json-schemas/ -name "*.md" -type f -delete
        shell: bash

      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - run: pip install mkdocs-material mike
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin gh-pages --depth=1
      - run: mike deploy --push ${{github.ref_name}}
